# =====================================================================
#  Agente Académico: todo el sistema con un solo `docker compose up -d`
#  Requisitos: Docker + NVIDIA Container Toolkit (GPU para vLLM y Ollama).
#  Configuración: copiar .env.example a .env y completar.
# =====================================================================
name: agente-academico

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-backend-env: &backend-env
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_URL: redis://redis:6379/0
    OPENSEARCH_URL: http://opensearch:9200
    OLLAMA_BASE_URL: http://ollama:11434/v1
    VLLM_BASE_URL: http://vllm:8000/v1
    PAPERS_DIR: /data/papers
    FIGURES_DIR: /data/figures
    HF_HOME: /models/hf

services:
  # ------------------------------------------------------------ datos
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      # Solo es accesible dentro de la red de Docker (no se publica el puerto por defecto)
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------ modelos
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    restart: unless-stopped
    <<: *gpu
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # Descarga el modelo de Ollama una sola vez (queda en el volumen `ollama`)
  ollama-pull:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL} && echo 'Modelo ${OLLAMA_MODEL} listo'"]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:-v0.11.0}
    restart: unless-stopped
    <<: *gpu
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    command:
      - --model=${VLLM_MODEL}
      - --served-model-name=${VLLM_MODEL}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization=${VLLM_GPU_UTIL:-0.45}
      - --limit-mm-per-prompt={"image":2}
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - --api-key=${VLLM_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 300s  # la primera vez descarga ~16 GB de pesos

  # ------------------------------------------------------------ aplicación
  # Ingesta con Docling: se ejecuta una vez al levantar y termina (idempotente).
  ingest:
    build: ./backend
    image: agente-academico-backend
    <<: *backend-env
    command: ["python", "-m", "ingest.ingest"]
    volumes:
      - ./data/papers:/data/papers:ro
      - ./data/processed:/data/processed
      - figures:/data/figures
      - hf_cache:/models/hf
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
    restart: "no"

  backend:
    build: ./backend
    image: agente-academico-backend
    restart: unless-stopped
    <<: *backend-env
    volumes:
      - figures:/data/figures
      - hf_cache:/models/hf
      - ./data/papers:/data/papers:ro
      - ./data/processed:/data/processed
      - ./backend/eval:/app/eval   # resultados de evaluación visibles en el host
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      ollama: { condition: service_started }
      vllm: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend: { condition: service_healthy }

  # Exposición pública para la demo. URL en http://localhost:4040 o en los logs.
  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command: ["http", "frontend:80", "--log", "stdout"]
    ports:
      - "4040:4040"
    depends_on:
      frontend: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  osdata:
  ollama:
  hf_cache:
  figures:
